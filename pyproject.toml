[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netpulse-remediator"
version = "0.1.0"
description = "Telemetry-driven network incident detection and safe remediation lab"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "prometheus-client>=0.20", "uvicorn>=0.29"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
netpulse = "netpulse.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
