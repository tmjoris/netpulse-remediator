[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netpulse-remediator"
dynamic = ["version"]
description = "Telemetry-driven network incident detection with guarded drain/undrain remediation"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Tanga Joris" }]
dependencies = [
    "fastapi>=0.110,<1",
    "prometheus-client>=0.20,<1",
    "pydantic>=2.6,<3",
    "uvicorn>=0.29,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "mypy>=1.10", "pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]

[project.scripts]
netpulse = "netpulse.cli:main"

[tool.setuptools.dynamic]
version = { attr = "netpulse.__version__" }

[tool.setuptools.packages.find]
include = ["netpulse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["netpulse"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL"]
ignore = ["PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR2004", "PLC0415"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["netpulse"]
