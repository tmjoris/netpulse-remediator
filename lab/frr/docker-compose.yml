# Two FRRouting routers joined by two parallel links running OSPF (ECMP).
#
#        10.0.1.0/24 (lnk1)
#   r1 ======================= r2
#        10.0.2.0/24 (lnk2)
#   lo 10.255.0.1         lo 10.255.0.2
#
# Usage: see lab/frr/README.md, or run lab/frr/demo.sh.
name: netpulse-lab

x-router: &router
  image: quay.io/frrouting/frr:10.2.1
  entrypoint: ["/bin/sh", "/lab/start.sh"]
  cap_add: [NET_ADMIN, NET_RAW, SYS_ADMIN]
  sysctls:
    net.ipv4.ip_forward: 1

services:
  r1:
    <<: *router
    container_name: netpulse-lab-r1
    hostname: r1
    environment: {LO_ADDR: 10.255.0.1/32}
    volumes:
      - ./start.sh:/lab/start.sh:ro
      - ./daemons:/etc/frr/daemons:ro
      - ./r1.conf:/lab/frr.conf:ro
      - ./vtysh.conf:/lab/vtysh.conf:ro
    networks:
      link1: {ipv4_address: 10.0.1.2}
      link2: {ipv4_address: 10.0.2.2}

  r2:
    <<: *router
    container_name: netpulse-lab-r2
    hostname: r2
    environment: {LO_ADDR: 10.255.0.2/32}
    volumes:
      - ./start.sh:/lab/start.sh:ro
      - ./daemons:/etc/frr/daemons:ro
      - ./r2.conf:/lab/frr.conf:ro
      - ./vtysh.conf:/lab/vtysh.conf:ro
    networks:
      link1: {ipv4_address: 10.0.1.3}
      link2: {ipv4_address: 10.0.2.3}

networks:
  link1:
    ipam: {config: [{subnet: 10.0.1.0/24}]}
  link2:
    ipam: {config: [{subnet: 10.0.2.0/24}]}
