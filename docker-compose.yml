# Local lab: NetPulse (dry-run executor) + Prometheus (scrape + alert rules) + Grafana.
#   docker compose up --build -d
#   netpulse simulate --scenario all --target http://127.0.0.1:8000
# Grafana: http://127.0.0.1:3000 (anonymous viewer), Prometheus: http://127.0.0.1:9090
services:
  netpulse:
    build: .
    image: netpulse-remediator:local
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # Leave unset for an unauthenticated local lab; set it for anything shared.
      NETPULSE_API_TOKEN: ${NETPULSE_API_TOKEN:-}
    volumes:
      - ./config/netpulse.example.toml:/etc/netpulse/netpulse.toml:ro
      - netpulse-data:/var/lib/netpulse
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    depends_on:
      netpulse:
        condition: service_healthy

  grafana:
    image: grafana/grafana:12.0.2
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/netpulse.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  netpulse-data:
