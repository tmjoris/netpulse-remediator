name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy
      - name: Tests (coverage gate in pyproject.toml)
        run: pytest --cov --cov-report=term-missing
      - name: Scenario lab
        run: netpulse simulate --scenario all
      - name: Validate example config
        run: netpulse check-config config/netpulse.example.toml

  stack:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Prometheus config and alert rules
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.5.0 check config /etc/prometheus/prometheus.yml
      - name: Start stack
        run: docker compose up --build -d --wait --wait-timeout 120
      - name: End-to-end scenarios over HTTP
        run: |
          python -m pip install -e .
          netpulse simulate --scenario all --target http://127.0.0.1:8000
          curl -fsS http://127.0.0.1:8000/metrics | grep -q 'netpulse_changes_total{action="drain"'
          docker compose exec -T netpulse netpulse audit verify /var/lib/netpulse/netpulse.audit.jsonl
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
